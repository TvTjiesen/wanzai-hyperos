[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeMultiplatform = "1.12.0"
# 1.12.4 起 ComponentActivity 才把 NavigationEventDispatcherOwner 挂到 decorView
# （setViewTreeNavigationEventDispatcherOwner）。Miuix 0.9.4 的 SearchBar /
# OverlayDialog / NavDisplay 都通过 NavigationBackHandler 读这个 owner，
# 缺了会直接抛 IllegalStateException（不是降级）。详见 docs/BUILD-KOTLIN.md §4.9。
activityCompose = "1.12.4"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
miuix = "0.9.4"
coroutines = "1.10.2"
okhttp = "5.1.0"
kotlinxSerialization = "1.9.0"
# 掃碼：CameraX（預覽 + 取幀）+ ZXing（解碼）。
# 為什麼不用 Google 的 play-services-code-scanner（一行就能掃）：
# 那是 Google Play 服務的一部分，而**國產手機普遍沒裝 GMS** ——
# 用了等於在目標機型上直接不可用。CameraX + ZXing 純本地，不依賴 GMS。
camerax = "1.4.2"
zxing = "3.5.3"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Miuix（HyperOS 设计语言，Compose Multiplatform 库）
miuix-ui = { group = "top.yukonga.miuix.kmp", name = "miuix-ui-android", version.ref = "miuix" }
miuix-preference = { group = "top.yukonga.miuix.kmp", name = "miuix-preference-android", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons-android", version.ref = "miuix" }
miuix-nav = { group = "top.yukonga.miuix.kmp", name = "miuix-nav-android", version.ref = "miuix" }

kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# 掃碼（見 versions 段的說明：不用 GMS 方案）
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# 注意：**不引 `androidx.security:security-crypto`** —— 该库公开 API 已整体 deprecated。
# 憑據加密改為直接用 Android Keystore（AES-256-GCM），見 session/SecureStore.kt
# 與 docs/BUILD-KOTLIN.md §4.16。
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# 注意：**不引 MockWebServer** —— 單測用 JDK 自帶的 com.sun.net.httpserver，
# 見 src/test/.../net/TestHttpServer.kt 與 docs/BUILD-KOTLIN.md §4.18。

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
