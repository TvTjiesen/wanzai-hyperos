# 构建内存策略（保守）
#
# ⚠️ 2026-10-10 教训：最初这里写的是 `-Xmx4g` + `parallel=true`，在 16GB 机器上
#    后台跑 Gradle 9.6 + AGP 9.4 + Kotlin 2.4（多 JVM）时占用了大量内存。
#    虽然当天的系统重启经查证是**内核驱动崩溃**（BugcheckCode 0xA，wintun.sys /
#    代理工具 TUN 驱动，与构建无关），但**没必要冒险**：
#    编译期把峰值压到最低，机器还能干别的。
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# 串行构建：并行会同时拉起多个 worker JVM，内存峰值翻倍
org.gradle.parallel=false

# 不用守护进程：构建结束即释放内存（代价是每次启动慢几秒，值得）
org.gradle.daemon=false

org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
